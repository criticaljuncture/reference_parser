inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - bin/*
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false

RSpec/EmptyExampleGroup:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false

RSpec:
  Language:
    Expectations:
      - expect_passing_cfr_scenario

plugins:
  - rubocop-performance
  - rubocop-rspec

inherit_gem:
  standard: config/base.yml
